name: Complexion CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Complexion/Complexion.sln
    - name: Build
      run: dotnet build Complexion/Complexion.sln --no-restore --configuration Release
    - name: Lint (dotnet format)
      run: dotnet format Complexion/Complexion.sln --verify-no-changes
    - name: Check for vulnerable packages
      run: dotnet list Complexion/Complexion.sln package --vulnerable --include-transitive
  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-check
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t complexion-api:${{ github.sha }} -f Complexion/Dockerfile Complexion
