name: Complexion CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions: {}

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore Complexion/Complexion.sln
    - name: Build
      run: dotnet build Complexion/Complexion.sln --no-restore --configuration Release
    - name: Run tests
      run: dotnet test Complexion/Complexion.sln --no-build --configuration Release --verbosity normal
    - name: Lint (dotnet format)
      run: dotnet format Complexion/Complexion.sln --verify-no-changes
    - name: Check for vulnerable packages
      run: dotnet list Complexion/Complexion.sln package --vulnerable --include-transitive

  super-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false
    - name: Super-Linter
      uses: super-linter/super-linter@v8.7.0
      env:
        DEFAULT_BRANCH: main
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        VALIDATE_ALL_CODEBASE: false
        VALIDATE_DOTNET_SLN_FORMAT_ANALYZERS: false
        VALIDATE_DOTNET_SLN_FORMAT_STYLE: false
        VALIDATE_DOTNET_SLN_FORMAT_WHITESPACE: false
        VALIDATE_CSHARP: false
        VALIDATE_BIOME_FORMAT: false
        VALIDATE_JSCPD: false
        VALIDATE_YAML_PRETTIER: false
        VALIDATE_CHECKOV: false
        VALIDATE_TRIVY: false
        VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
        VALIDATE_SQLFLUFF: false
        VALIDATE_JSON_PRETTIER: false
        VALIDATE_BIOME_LINT: false
        VALIDATE_CSS: false
        VALIDATE_CSS_PRETTIER: false
        VALIDATE_HTML_PRETTIER: false
        VALIDATE_JAVASCRIPT_PRETTIER: false
        VALIDATE_JSON: false
        VALIDATE_MARKDOWN_PRETTIER: false
        VALIDATE_NATURAL_LANGUAGE: false
        VALIDATE_TSX: false
        VALIDATE_TYPESCRIPT_ES: false
        VALIDATE_TYPESCRIPT_PRETTIER: false

  frontend-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      run: npm ci
      working-directory: complexion-client
    - name: Build
      run: npm run build
      working-directory: complexion-client

  docker-build:
    runs-on: ubuntu-latest
    needs: [build-and-check, super-lint, frontend-check]
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker image
      run: docker build -t complexion-api:${{ github.run_number }} -f Complexion/Dockerfile Complexion
