services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: ${SA_PASSWORD}
      ACCEPT_EULA: ${ACCEPT_EULA}
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql

  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data

  migrations:
    build:
      context: ./Complexion
      dockerfile: Complexion.Migrations/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Server=${DB_SERVER};Database=Complexion;User Id=${DB_USER};Password=${SA_PASSWORD};TrustServerCertificate=True;"
    depends_on:
      sql:
        condition: service_healthy

  api:
    build:
      context: ./Complexion
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__DefaultConnection: "Server=${DB_SERVER};Database=Complexion;User Id=${DB_USER};Password=${SA_PASSWORD};TrustServerCertificate=True;"
      Jwt__Key: ${JWT_KEY}
      Serilog__WriteTo__1__Args__serverUrl: "http://seq:5341"
    depends_on:
      sql:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      seq:
        condition: service_started

  client:
    build:
      context: ./complexion-client
    ports:
      - "5173:5173"
    volumes:
      - ./complexion-client:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  sql-data:
  seq-data: